<script>
    // Theme toggle functionality
    const themeButtons = document.querySelectorAll('.theme-btn');
    const htmlElement = document.documentElement;
    
    // Check for saved theme preference or default to 'light'
    const currentTheme = localStorage.getItem('theme') || 'light';
    
    // Apply theme
    function applyTheme(theme) {
        if (theme === 'dark') {
            htmlElement.classList.add('dark');
        } else if (theme === 'light') {
            htmlElement.classList.remove('dark');
        } else if (theme === 'auto') {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
                htmlElement.classList.add('dark');
            } else {
                htmlElement.classList.remove('dark');
            }
        }
    }
    
    // Initialize theme
    applyTheme(currentTheme);
    
    // Set active button on load
    themeButtons.forEach(btn => {
        if (btn.dataset.theme === currentTheme) {
            btn.classList.add('bg-accent', 'text-foreground');
            btn.classList.remove('text-muted-foreground');
        }
    });
    
    // Theme toggle click handlers
    themeButtons.forEach(button => {
        button.addEventListener('click', () => {
            const theme = button.dataset.theme;
            
            applyTheme(theme);
            localStorage.setItem('theme', theme);
            
            // Update active state
            themeButtons.forEach(btn => {
                btn.classList.remove('bg-accent', 'text-foreground');
                btn.classList.add('text-muted-foreground');
            });
            button.classList.add('bg-accent', 'text-foreground');
            button.classList.remove('text-muted-foreground');
        });
    });
    
    // Listen for system theme changes if auto is selected
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (localStorage.getItem('theme') === 'auto') {
            applyTheme('auto');
        }
    });
</script>
